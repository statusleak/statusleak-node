name: Release

# Push a tag matching package.json, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Publishes with npm trusted publishing (OIDC, no stored token) and provenance.
# One-time setup on npmjs.com: package → Settings → Trusted publishing →
# GitHub Actions, repository statusleak/statusleak-node, workflow release.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Publish
        run: |
          # Pre-releases (0.2.0-beta.1) go to the "beta" tag, not "latest".
          if node -p "require('./package.json').version" | grep -q -- '-'; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
